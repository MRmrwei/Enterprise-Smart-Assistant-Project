Name: gateway-api
Host: 0.0.0.0
Port: 8888

AuthConfig:
  AccessSecret: "{B)N;+)kTKDxHq@NERDUqS?A34OgzU-k"
  AccessExpire: 31536000
  RefreshSecret: "UVzF%8qe]b5*+lQ;N<PYU}T-K<,IL8T-"  # 独立的 Refresh Token 密钥
  RefreshExpire: 604800     # Refresh Token 有效期：7天（秒）

Upstreams:
  - Grpc:
      Target: localhost:8081          # 你的 RPC 服务地址
    ProtoSets:
      - pb/service.pb                   # 加载描述文件
    Mappings:
      - Method: post                  # HTTP 方法
        Path: /login                  # 你希望对外暴露的路径
        RpcPath: main.rpc/Login       # 对应 proto 里的 package.service/method
  - Http:
      Name: "service-mcp"
      Target: localhost:8083
      Timeout: 3000    # 单位为毫秒，默认值 3000
    Mappings:
      - Method: POST
        Path: /mcp
#  - Http:
#      Name: "agent"
#      Target: localhost:8084
#      Timeout: 60000
#    Mappings:
#      - Method: POST
#        Path: /chat

AgentAddr:
  - Host: http://127.0.0.1:8084
    Name: "agent"
    Path: /chat

Log:
  Mode: "console" # console, file, volume
  Path: "logs"
  Level: "debug" # debug, info, error, severe
  Compress: false
  KeepDays: 7
  Encoding: "plain" # json 或 plain（默认是 plain）
  MaxSize: 1                  # 单个文件最大 100MB，超过自动切割
  MaxBackups: 10                # 保留最近 10 个备份文件
  MaxAge: 30                    # 保留 30 天内的日志（按修改时间）

AgentRpcConfig:
  Endpoints:
    - 127.0.0.1:50051