<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 对话助手 · SSE 流式</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css" />
    <link rel="stylesheet" href="resources/css/common.css" />
    <link rel="stylesheet" href="resources/css/chat.css" />
    <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
</head>
<body>

<div id="app">
    <header class="app-header">
        <div class="header-left">
            <div class="logo">
                <span class="icon">✦</span>
                <h1>AI 对话助手</h1>
            </div>
            <div class="status">
                <span class="dot"></span>
                <span>在线 · SSE 流式</span>
            </div>
        </div>
        <div class="header-right">
            <a href="nav.html" class="nav-back-btn">
                <i class="el-icon-s-home"></i> 返回导航
            </a>
            <!-- 退出登录按钮 -->
            <button class="logout-btn" @click="handleLogout" :disabled="isLoggingOut">
                <i class="el-icon-switch-button"></i>
                {{ isLoggingOut ? '退出中...' : '退出登录' }}
            </button>
        </div>
    </header>

    <main class="app-main" ref="mainContainer">
        <div class="messages">
            <div v-if="messages.length === 0" class="empty-state">
                <div class="empty-icon">💬</div>
                <div class="empty-text">开始你的第一次对话</div>
                <div class="empty-sub">输入问题，AI 将流式展示推理过程</div>
            </div>

            <div v-for="(msg, idx) in messages" :key="idx" class="message" :class="msg.type">
                <div class="avatar">
                    {{ msg.type === 'ai' ? 'AI' : '我' }}
                </div>
                <div class="bubble">
                    <template v-if="msg.type === 'user'">
                        <div class="text">{{ msg.content }}</div>
                    </template>
                    <template v-if="msg.type === 'ai'">
                        <div v-if="msg.thinking" class="thinking-placeholder">
                            <span>正在思考</span>
                            <span class="dots">
                                <span></span><span></span><span></span>
                            </span>
                        </div>
                        <div class="ai-reply">
                            <div v-if="msg.reasoning && msg.reasoning.length > 0">
                                <div class="reasoning-section">
                                    <span class="label">
                                        <span>🧠 推理过程</span>
                                    </span>
                                    <span class="divider"></span>
                                </div>
                                <div class="reasoning-blocks">
                                    <div v-for="(block, bi) in msg.reasoning" :key="bi" class="reasoning-block">
                                        <div class="block-content" v-html="block.content"></div>
                                    </div>
                                </div>
                            </div>
                            <div v-if="msg.answer || msg._answerComplete === false" class="answer-section">
                                <div class="answer-label">最终答案</div>
                                <div v-if="!msg.answer" class="thinking-placeholder">
                                    <span class="dots">
                                        <span></span><span></span><span></span>
                                    </span>
                                </div>
                                <div class="answer-text" v-html="msg.answer"></div>
                            </div>
                            <div v-if="msg.error" class="error-message">
                                ⚠️ {{ msg.error }}
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="input-wrapper">
            <el-input
                    type="textarea"
                    v-model="inputText"
                    :rows="1"
                    placeholder="输入你的问题，按 Enter 发送…"
                    @keydown.native.enter.prevent="handleSend"
                    :disabled="isProcessing"
                    ref="inputArea"
                    autofocus>
            </el-input>
            <el-button
                    class="send-btn"
                    :disabled="!inputText.trim() || isProcessing"
                    @click="handleSend"
                    type="primary">
                <i class="el-icon-s-promotion"></i>
                发送
            </el-button>
        </div>
    </footer>
</div>

<script>
    // ---------- 工具函数：获取 Token ----------
    function getToken() {
        return localStorage.getItem('chat_token');
    }

    // ---------- 工具函数：跳转到登录页 ----------
    function redirectToLogin() {
        window.location.href = '/view/login.html';
    }

    new Vue({
        el: '#app',
        data: {
            inputText: '',
            isProcessing: false,
            messages: [],
            charQueue: [],
            threadId: "",
            streamTimer: null,
            activeMsgIndex: null,
            isLoggingOut: false  // 退出登录 loading 状态
        },
        mounted() {
            // ---------- 1. 检查 Token，不存在则跳转 ----------
            const token = getToken();
            if (!token) {
                redirectToLogin();
                return;
            }

            this.$nextTick(() => {
                this.scrollToBottom();
                this.$refs.inputArea.focus();
            });
        },
        beforeDestroy() {
            if (this.streamTimer) {
                clearInterval(this.streamTimer);
                this.streamTimer = null;
            }
        },
        watch: {
            messages: {
                handler() {
                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });
                },
                deep: true
            }
        },
        methods: {
            // ---------- 退出登录 ----------
            async handleLogout() {
                if (this.isLoggingOut) return;
                this.isLoggingOut = true;

                const token = getToken();
                try {
                    // const response = await fetch('http://127.0.0.1:8888/logout', {
                    //     method: 'POST',
                    //     headers: {
                    //         'Content-Type': 'application/json',
                    //         'Authorization': token ? 'Bearer ' + token : ''
                    //     }
                    // });
                    //
                    // // 无论后端是否成功，都清除本地 token 并跳转
                    // // 但如果后端返回错误，我们仍然清除本地，因为用户主动退出
                    // if (!response.ok) {
                    //     console.warn('Logout API returned non-200:', response.status);
                    // }
                    //
                    // // 尝试解析响应（如果有）
                    // try {
                    //     const result = await response.json();
                    //     console.log('Logout response:', result);
                    // } catch (e) {
                    //     // 忽略 JSON 解析错误
                    // }

                    // 清除本地 token
                    localStorage.removeItem('chat_token');

                    // 使用 Element UI 提示（可选）
                    this.$message({
                        message: '已退出登录',
                        type: 'success',
                        duration: 1500
                    });

                    // 跳转到登录页
                    setTimeout(() => {
                        redirectToLogin();
                    }, 300);

                } catch (error) {
                    console.error('Logout error:', error);
                    // 即使请求失败，也清除 token 并跳转
                    localStorage.removeItem('chat_token');
                    this.$message({
                        message: '退出请求异常，已清除登录状态',
                        type: 'warning',
                        duration: 2000
                    });
                    setTimeout(() => {
                        redirectToLogin();
                    }, 500);
                } finally {
                    this.isLoggingOut = false;
                }
            },

            // ---------- 发送消息 ----------
            handleSend() {
                const text = this.inputText.trim();
                if (!text || this.isProcessing) return;

                if (!getToken()) {
                    redirectToLogin();
                    return;
                }

                if (this.streamTimer) {
                    clearInterval(this.streamTimer);
                    this.streamTimer = null;
                }
                this.charQueue = [];
                this.activeMsgIndex = null;

                this.messages.push({
                    type: 'user',
                    content: text
                });
                this.inputText = '';
                this.isProcessing = true;

                const aiIdx = this.messages.length;
                this.messages.push({
                    type: 'ai',
                    thinking: true,
                    reasoning: [],
                    answer: '',
                    _answerComplete: false,
                    error: null
                });

                this.fetchSSE(text, aiIdx);
            },

            // ---------- SSE 请求 ----------
            fetchSSE(question, msgIndex) {
                const url = '/chat';
                const token = getToken();
                if (!token) {
                    this.handleError(msgIndex, '未登录，请重新登录');
                    redirectToLogin();
                    return;
                }
                console.log("sse start == ", this.threadId)
                const options = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ question: question, thread_id: this.threadId }),
                };

                fetch(url, options)
                    .then(response => {
                        if (response.status === 401) {
                            localStorage.removeItem('chat_token');
                            redirectToLogin();
                            throw new Error('登录已过期，请重新登录');
                        }
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let buffer = '';
                        const readStream = () => {
                            reader.read().then(({ done, value }) => {
                                if (done) {
                                    this.finishAI(msgIndex);
                                    return;
                                }
                                buffer += decoder.decode(value, { stream: true });
                                const lines = buffer.split('\n\n');
                                buffer = lines.pop() || '';
                                for (const event of lines) {
                                    if (event.trim() === '') continue;
                                    this.processSSEEvent(event, msgIndex);
                                }
                                readStream();
                            }).catch(err => {
                                this.handleError(msgIndex, '读取流数据失败: ' + err.message);
                            });
                        };
                        readStream();
                    })
                    .catch(err => {
                        if (err.message.includes('登录已过期')) {
                            return;
                        }
                        this.handleError(msgIndex, '请求失败: ' + err.message);
                    });
            },

            processSSEEvent(eventData, msgIndex) {
                const lines = eventData.split('\n');
                let eventType = null;
                let dataLine = '';
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('event:')) {
                        eventType = trimmed.substring(6).trim();
                    } else if (trimmed.startsWith('data:')) {
                        dataLine = trimmed.substring(5).trim();
                    }
                }
                if (!dataLine) return;

                let data = null;
                try {
                    data = JSON.parse(dataLine);
                } catch (e) {
                    const msg = this.messages[msgIndex];
                    if (msg && msg.answer !== undefined) {
                        this.enqueueContent(msgIndex, 'answer', dataLine, 0);
                    }
                    return;
                }
                console.log("data = ", data, eventType)
                if (eventType === "start") {
                    this.threadId = data.thread_id;
                }else{
                    this.updateAIFromEvent(data, msgIndex, eventType);
                }
            },

            updateAIFromEvent(data, msgIndex, eventType) {
                const msg = this.messages[msgIndex];
                if (!msg) return;

                const type = data.type;

                if (type === 'reasoning' || type === 'answer') {
                    if (data.content) {
                        const blockIndex = type === 'reasoning' ? (data.index !== undefined ? data.index : 0) : null;
                        this.enqueueContent(msgIndex, type, data.content, blockIndex);
                        if (msg.thinking) msg.thinking = false;
                        this.startStreamTimer();
                    }
                } else if (type === 'done' || type === 'end') {
                    msg._answerComplete = true;
                    this.isProcessing = false;
                    this.$refs.inputArea.focus();
                } else {
                    if (data.content) {
                        this.enqueueContent(msgIndex, 'answer', data.content, 0);
                        this.startStreamTimer();
                    }
                }
            },

            enqueueContent(msgIndex, type, content, blockIndex) {
                const tokens = this.tokenizeHTML(content);
                for (let token of tokens) {
                    this.charQueue.push({
                        token: token,
                        type: type,
                        blockIndex: blockIndex,
                        msgIndex: msgIndex
                    });
                }
            },

            tokenizeHTML(html) {
                const tokens = [];
                const regex = /(<[^>]+>)|(&[a-zA-Z]+;)|([^<&]+)/g;
                let match;
                while ((match = regex.exec(html)) !== null) {
                    if (match[1]) {
                        tokens.push(match[1]);
                    } else if (match[2]) {
                        tokens.push(match[2]);
                    } else if (match[3]) {
                        const chars = match[3].split('');
                        for (let ch of chars) {
                            tokens.push(ch);
                        }
                    }
                }
                return tokens;
            },

            startStreamTimer() {
                if (this.streamTimer) return;
                this.streamTimer = setInterval(() => {
                    if (this.charQueue.length === 0) {
                        if (!this.isProcessing) {
                            clearInterval(this.streamTimer);
                            this.streamTimer = null;
                        }
                        return;
                    }

                    const item = this.charQueue.shift();
                    const msg = this.messages[item.msgIndex];
                    if (!msg) return;

                    if (item.type === 'answer') {
                        msg.answer += item.token;
                    }else if (item.type === 'reasoning') {
                        const idx = item.blockIndex || 0;
                        while (msg.reasoning.length <= idx) {
                            msg.reasoning.push({ title: '', content: '' });
                        }
                        msg.reasoning[idx].content += item.token;
                    }

                    this.scrollToBottom();
                }, 30);
            },

            handleError(msgIndex, errorMsg) {
                const msg = this.messages[msgIndex];
                if (msg) {
                    msg.thinking = false;
                    msg.error = errorMsg;
                    msg._answerComplete = true;
                }
                this.isProcessing = false;
                if (this.streamTimer) {
                    clearInterval(this.streamTimer);
                    this.streamTimer = null;
                }
                this.charQueue = [];
                console.error('SSE Error:', errorMsg);
                this.$refs.inputArea.focus();
            },

            finishAI(msgIndex) {
                const msg = this.messages[msgIndex];
                if (msg) {
                    msg.thinking = false;
                    msg._answerComplete = true;
                }
                this.isProcessing = false;
                this.$refs.inputArea.focus();
            },

            scrollToBottom() {
                const container = this.$refs.mainContainer;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }
        }
    });
</script>

</body>
</html>
