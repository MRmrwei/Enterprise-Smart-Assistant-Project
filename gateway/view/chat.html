<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 对话助手 · SSE 流式</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css" />
    <link rel="stylesheet" href="./main.css" />
    <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
</head>
<body>

<div id="app">
    <header class="app-header">
        <div class="logo">
            <span class="icon">✦</span>
            <h1>AI 对话助手</h1>
        </div>
        <div class="status">
            <span class="dot"></span>
            <span>在线 · SSE 流式</span>
        </div>
    </header>

    <main class="app-main" ref="mainContainer">
        <div class="messages">
            <div v-if="messages.length === 0" class="empty-state">
                <div class="empty-icon">💬</div>
                <div class="empty-text">开始你的第一次对话</div>
                <div class="empty-sub">输入问题，AI 将流式展示推理过程</div>
            </div>

            <div v-for="(msg, idx) in messages" :key="idx" class="message" :class="msg.type">
                <div class="avatar">
                    {{ msg.type === 'ai' ? 'AI' : '我' }}
                </div>
                <div class="bubble">
                    <template v-if="msg.type === 'user'">
                        <div class="text">{{ msg.content }}</div>
                    </template>
                    <template v-if="msg.type === 'ai'">

                        <div v-if="msg.thinking" class="thinking-placeholder">
                            <span>正在思考</span>
                            <span class="dots">
                                    <span></span><span></span><span></span>
                            </span>
                        </div>
                        <div class="ai-reply">

                            <div v-if="msg.reasoning && msg.reasoning.length > 0">
                                <div class="reasoning-section">
                                    <span class="label">
                                        <span>🧠 推理过程</span>
<!--                                        <span class="badge">{{ msg.reasoning.length }} 步</span>-->
                                    </span>
                                    <span class="divider"></span>
                                </div>
                                <div class="reasoning-blocks">
                                    <div v-for="(block, bi) in msg.reasoning" :key="bi" class="reasoning-block">
                                        <div class="block-content" v-html="block.content"></div>
                                    </div>
                                </div>
                            </div>

                            <div v-if="msg.answer || msg._answerComplete === false" class="answer-section">
                                <div class="answer-label">最终答案</div>
                                <div v-if="!msg.answer" class="thinking-placeholder">
                                    <span class="dots">
                                        <span></span><span></span><span></span>
                                    </span>
                                </div>
                                <div class="answer-text" v-html="msg.answer"></div>
                            </div>

                            <div v-if="msg.error" class="error-message">
                                ⚠️ {{ msg.error }}
                            </div>


                        </div>



                    </template>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="input-wrapper">
            <el-input
                    type="textarea"
                    v-model="inputText"
                    :rows="1"
                    placeholder="输入你的问题，按 Enter 发送…"
                    @keydown.native.enter.prevent="handleSend"
                    :disabled="isProcessing"
                    ref="inputArea"
                    autofocus>
            </el-input>
            <el-button
                    class="send-btn"
                    :disabled="!inputText.trim() || isProcessing"
                    @click="handleSend"
                    type="primary">
                <i class="el-icon-s-promotion"></i>
                发送
            </el-button>
        </div>
    </footer>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            inputText: '',
            isProcessing: false,
            messages: [
                // 初始示例（静态）
                // {
                //     type: 'user',
                //     content: '如何提高学习效率？'
                // },
                // {
                //     type: 'ai',
                //     reasoning: [{
                //         title: '问题分析',
                //         content: '用户希望了解提高学习效率的方法。这是一个关于学习策略和自我管理的综合性问题，需要从认知科学、时间管理和学习习惯等多个维度进行拆解。'
                //     }, {
                //         title: '知识检索',
                //         content: '基于认知心理学和教育学的研究，高效学习的关键因素包括：<br>• 主动回忆 vs 被动重读<br>• 间隔重复 vs 集中突击<br>• 深度加工 vs 浅层浏览<br>• 专注状态 vs 多任务切换'
                //     }, {
                //         title: '逻辑推理与综合',
                //         content: '结合上述理论，高效学习需要构建一个闭环系统：<strong>计划 → 专注执行 → 主动回顾 → 反馈调整</strong>。同时要警惕"学习错觉"——即看了=学会了，实际上只有经过测试和应用的知识才是真正掌握的。'
                //     }],
                //     answer: '提高学习效率的核心方法是：<strong>① 使用主动回忆</strong>（合上书本复述内容）；<strong>② 间隔重复</strong>（按艾宾浩斯曲线复习）；<strong>③ 费曼技巧</strong>（用自己的话解释概念）；<strong>④ 番茄工作法</strong>（25分钟专注+5分钟休息）。最重要的是，<strong>输出倒逼输入</strong>——通过做题、写作、教授他人来巩固知识。'
                // }
            ],
            // ------------------- 新增：流式字符队列和定时器 -------------------
            charQueue: [],          // 存储待显示的原子单元 { token, type, blockIndex, msgIndex }
            streamTimer: null,      // setInterval 句柄
            activeMsgIndex: null    // 当前正在流式输出的消息索引
        },
        mounted() {
            this.$nextTick(() => {
                this.scrollToBottom();
                this.$refs.inputArea.focus();
            });
        },
        beforeDestroy() {
            // 清理定时器，避免内存泄漏
            if (this.streamTimer) {
                clearInterval(this.streamTimer);
                this.streamTimer = null;
            }
        },
        watch: {
            messages: {
                handler() {
                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });
                },
                deep: true
            }
        },
        methods: {
            // ---------- 发送消息 ----------
            handleSend() {
                const text = this.inputText.trim();
                if (!text || this.isProcessing) return;

                // 清空旧队列和定时器
                if (this.streamTimer) {
                    clearInterval(this.streamTimer);
                    this.streamTimer = null;
                }
                this.charQueue = [];
                this.activeMsgIndex = null;

                // 添加用户消息
                this.messages.push({
                    type: 'user',
                    content: text
                });
                this.inputText = '';
                this.isProcessing = true;

                // 创建 AI 消息占位
                const aiIdx = this.messages.length;
                this.messages.push({
                    type: 'ai',
                    thinking: true,
                    reasoning: [],
                    answer: '',
                    _answerComplete: false,
                    error: null
                });

                // 调用 SSE
                this.fetchSSE(text, aiIdx);
            },

            // ---------- SSE 请求 ----------
            fetchSSE(question, msgIndex) {
                const url = '/agent/chat';
                const options = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream',
                    },
                    body: JSON.stringify({ question: question }),
                };

                fetch(url, options)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let buffer = '';
                        const readStream = () => {
                            reader.read().then(({ done, value }) => {
                                if (done) {
                                    this.finishAI(msgIndex);
                                    return;
                                }
                                buffer += decoder.decode(value, { stream: true });
                                const lines = buffer.split('\n\n');
                                buffer = lines.pop() || '';
                                for (const event of lines) {
                                    if (event.trim() === '') continue;
                                    this.processSSEEvent(event, msgIndex);
                                }
                                readStream();
                            }).catch(err => {
                                this.handleError(msgIndex, '读取流数据失败: ' + err.message);
                            });
                        };
                        readStream();
                    })
                    .catch(err => {
                        this.handleError(msgIndex, '请求失败: ' + err.message);
                    });
            },

            // ---------- 处理 SSE 事件 ----------
            processSSEEvent(eventData, msgIndex) {
                const lines = eventData.split('\n');
                let eventType = null;
                let dataLine = '';
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('event:')) {
                        eventType = trimmed.substring(6).trim();
                    } else if (trimmed.startsWith('data:')) {
                        dataLine = trimmed.substring(5).trim();
                    }
                }
                if (!dataLine) return;

                let data = null;
                try {
                    data = JSON.parse(dataLine);
                } catch (e) {
                    // 非 JSON，直接当普通文本追加（兼容）
                    const msg = this.messages[msgIndex];
                    if (msg && msg.answer !== undefined) {
                        // 将普通文本也加入队列（拆分成字符）
                        this.enqueueContent(msgIndex, 'answer', dataLine, 0);
                    }
                    return;
                }

                this.updateAIFromEvent(data, msgIndex, eventType);
            },

            // ---------- 更新 AI 消息（核心改造） ----------
            updateAIFromEvent(data, msgIndex, eventType) {
                const msg = this.messages[msgIndex];
                if (!msg) return;

                const type = data.type;

                if (type === 'reasoning' || type === 'answer') {
                    if (data.content) {
                        const blockIndex = type === 'reasoning' ? (data.index !== undefined ? data.index : 0) : null;
                        // 将内容拆成原子单元（标签、实体、字符）并入队
                        this.enqueueContent(msgIndex, type, data.content, blockIndex);
                        // 移除 thinking 状态
                        if (msg.thinking) msg.thinking = false;
                        // 启动定时器（如果尚未启动）
                        this.startStreamTimer();
                    }
                } else if (type === 'done' || type === 'end') {
                    msg._answerComplete = true;
                    this.isProcessing = false;
                    this.$refs.inputArea.focus();
                    // 流结束，但定时器会继续消费完队列
                } else {
                    // 未知类型，按普通文本追加
                    if (data.content) {
                        this.enqueueContent(msgIndex, 'answer', data.content, 0);
                        this.startStreamTimer();
                    }
                }
            },

            // ---------- 将内容拆分成原子并入队 ----------
            enqueueContent(msgIndex, type, content, blockIndex) {
                const tokens = this.tokenizeHTML(content);
                for (let token of tokens) {
                    this.charQueue.push({
                        token: token,
                        type: type,
                        blockIndex: blockIndex,
                        msgIndex: msgIndex
                    });
                }
            },

            // ---------- 将 HTML 拆成原子（标签/实体/单字符） ----------
            tokenizeHTML(html) {
                const tokens = [];
                const regex = /(<[^>]+>)|(&[a-zA-Z]+;)|([^<&]+)/g;
                let match;
                while ((match = regex.exec(html)) !== null) {
                    if (match[1]) {
                        // 完整标签
                        tokens.push(match[1]);
                    } else if (match[2]) {
                        // 实体符号（如 &nbsp;）
                        tokens.push(match[2]);
                    } else if (match[3]) {
                        // 普通文本，拆成单个字符
                        const chars = match[3].split('');
                        for (let ch of chars) {
                            tokens.push(ch);
                        }
                    }
                }
                return tokens;
            },

            // ---------- 启动流式定时器 ----------
            startStreamTimer() {
                if (this.streamTimer) return;
                this.streamTimer = setInterval(() => {
                    if (this.charQueue.length === 0) {
                        // 队列为空时，若流已结束则清除定时器
                        if (!this.isProcessing) {
                            clearInterval(this.streamTimer);
                            this.streamTimer = null;
                        }
                        return;
                    }

                    const item = this.charQueue.shift();
                    const msg = this.messages[item.msgIndex];
                    if (!msg) return;

                    if (item.type === 'answer') {
                        msg.answer += item.token;
                    } else if (item.type === 'reasoning') {
                        const idx = item.blockIndex || 0;
                        while (msg.reasoning.length <= idx) {
                            msg.reasoning.push({ title: '', content: '' });
                        }
                        msg.reasoning[idx].content += item.token;
                    }

                    // 滚动到底部
                    this.scrollToBottom();
                }, 30); // 每 30ms 一个原子
            },

            // ---------- 错误处理 ----------
            handleError(msgIndex, errorMsg) {
                const msg = this.messages[msgIndex];
                if (msg) {
                    msg.thinking = false;
                    msg.error = errorMsg;
                    msg._answerComplete = true;
                }
                this.isProcessing = false;
                if (this.streamTimer) {
                    clearInterval(this.streamTimer);
                    this.streamTimer = null;
                }
                this.charQueue = [];
                console.error('SSE Error:', errorMsg);
                this.$refs.inputArea.focus();
            },

            // ---------- 流结束 ----------
            finishAI(msgIndex) {
                const msg = this.messages[msgIndex];
                if (msg) {
                    msg.thinking = false;
                    msg._answerComplete = true;
                }
                this.isProcessing = false;
                // 队列可能在消费中，定时器会自行停止
                this.$refs.inputArea.focus();
            },

            // ---------- 滚动到底部 ----------
            scrollToBottom() {
                const container = this.$refs.mainContainer;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }
        }
    });
</script>

</body>
</html>
