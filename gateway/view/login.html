<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Vue & Element</title>
    <!-- 引入 Vue 3 和 Element Plus 样式 & 组件库 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
    <link rel="stylesheet" href="resources/css/common.css" />
    <link rel="stylesheet" href="resources/css/login.css" />
</head>
<body>
<div id="app">
    <div class="login-container">
        <div class="login-title">
            <span>用户登录</span>
        </div>

        <el-form
                ref="loginFormRef"
                :model="loginForm"
                :rules="loginRules"
                label-width="0"
                class="demo-ruleForm"
                status-icon
                @submit.native.prevent="handleLogin"
        >
            <el-form-item prop="username">
                <el-input
                        v-model="loginForm.username"
                        placeholder="请输入账号"
                        prefix-icon="User"
                        clearable
                        size="large"
                        @keyup.enter="handleLogin"
                />
            </el-form-item>

            <el-form-item prop="password">
                <el-input
                        v-model="loginForm.password"
                        placeholder="请输入密码"
                        prefix-icon="Lock"
                        show-password
                        clearable
                        size="large"
                        @keyup.enter="handleLogin"
                />
            </el-form-item>

            <el-form-item>
                <el-button
                        type="primary"
                        size="large"
                        :loading="loading"
                        @click="handleLogin"
                >
                    {{ loading ? '登录中...' : '登 录' }}
                </el-button>
            </el-form-item>
        </el-form>

        <div class="login-footer">
            <span>演示 · 账号密码任意 (非空即可)</span>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, reactive, onMounted } = Vue;
    const { ElMessage } = ElementPlus;

    const app = createApp({
        setup() {
            const loginForm = reactive({
                username: '',
                password: ''
            });

            const loginRules = {
                username: [
                    { required: true, message: '请输入账号', trigger: 'blur' },
                    { min: 1, message: '账号不能为空', trigger: 'blur' }
                ],
                password: [
                    { required: true, message: '请输入密码', trigger: 'blur' },
                    { min: 1, message: '密码不能为空', trigger: 'blur' }
                ]
            };

            const loading = ref(false);
            const loginFormRef = ref(null);

            // ---------- 核心：登录跳转 & Token 存储 ----------
            const handleLogin = async () => {
                if (!loginFormRef.value) return;
                try {
                    await loginFormRef.value.validate();
                } catch {
                    return;
                }

                loading.value = true;
                const payload = {
                    account: loginForm.username,
                    password: loginForm.password
                };

                try {
                    const response = await fetch('http://127.0.0.1:8888/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    // 解析响应
                    const result = await response.json();

                    if (response.ok && result.token) {
                        // 1. 存储 token (localStorage)
                        localStorage.setItem('chat_token', result.token);

                        // 2. 提示成功
                        ElMessage({
                            message: '登录成功，正在跳转...',
                            type: 'success',
                            duration: 1500
                        });

                        // 3. 跳转到 chat 页面
                        setTimeout(() => {
                            window.location.href = 'http://127.0.0.1:8888/view/nav.html';
                        }, 500);
                    } else {
                        // 登录失败（无token 或 状态码非2xx）
                        const errMsg = result.response?.message || result.message || '登录失败，请检查账号密码';
                        ElMessage({
                            message: errMsg,
                            type: 'error',
                            duration: 4000
                        });
                    }
                } catch (error) {
                    ElMessage({
                        message: `网络异常: ${error.message || '请检查后端服务'}`,
                        type: 'error',
                        duration: 4000
                    });
                } finally {
                    loading.value = false;
                }
            };

            // ---------- 页面加载时检查 token，若已存在则直接跳转 ----------
            onMounted(() => {
                const token = localStorage.getItem('chat_token');
                if (token) {
                    // 如果已经有 token，说明已登录，直接跳转到 chat 页面
                    window.location.href = '/view/nav.html';
                }
            });

            return {
                loginForm,
                loginRules,
                loading,
                loginFormRef,
                handleLogin
            };
        }
    });

    app.use(ElementPlus);
    app.mount('#app');
</script>
</body>
</html>
